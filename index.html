<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Game Company Name</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="company-header">
        <h1>Your Company Name</h1>
        <p>Short tagline about your studio.</p>
    </header>

    <main class="game-grid">
        <!-- Game Block 1 -->
        <div class="game-card">
            <img src="assets/game1-preview.png" alt="Game Title Preview">
            <h2>Game Title</h2>
            <p>A brief one-sentence description of the game.</p>
            <div class="links">
                <a href="builds/game1-win.zip" class="btn">Download (PC)</a>
                <a href="https://yourname.itch.io/game" target="_blank" class="btn">Itch.io</a>
            </div>
        </div>

        <!-- Repeat .game-card for additional games -->
    </main>
</body>
</html>
